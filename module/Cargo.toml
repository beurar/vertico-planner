[package]
name = "vertico-planner-module"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# `cdylib` is what `spacetime publish` compiles to wasm; `rlib` so the pure helpers in
# `validate.rs` can also be linked by a host-side test crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
spacetimedb = "~2.8.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
